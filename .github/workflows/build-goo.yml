name: Build Goo Engine (Windows)

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches: [ main ]  # Auto-trigger on push to main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies via Chocolatey
        run: |
          choco install -y cmake --installargs 'ADD_CMAKE_TO_PATH=System'
          choco install -y git
          choco install -y ninja
          choco install -y python --version=3.10.11
          choco install -y visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --includeOptional"

      - name: Add tools to PATH
        run: |
          echo "C:\Program Files\CMake\bin" >> $env:GITHUB_PATH
          echo "C:\Program Files\Git\cmd" >> $env:GITHUB_PATH  # Note: 'cmd' instead of 'bin' on Windows
          echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH

      - name: Update Blender libraries
        run: make update
        shell: bash

      - name: Configure with CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Blender
        run: cmake --build build --config Release --target blender

      - name: Package DLLs (required for Windows)
        run: |
          mkdir package
          cp build/bin/Release/blender.exe package/
          cp "C:/Windows/System32/"{vcomp140.dll,msvcp140.dll,ucrtbase.dll} package/  # MSVC runtime DLLs

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: goo-engine-windows
          path: package/
