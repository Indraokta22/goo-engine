name: Build Goo Engine (Windows)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          choco install -y cmake --installargs 'ADD_CMAKE_TO_PATH=System'
          choco install -y git ninja python --version=3.10.11
          choco install -y visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended"

      - name: Verify or create lib directory (skip make update)
        run: |
          if (!(Test-Path -Path ".\lib")) {
              mkdir lib
              echo "Created 'lib' directory. Run 'make update' locally if needed."
          }
        shell: pwsh  # PowerShell for Windows

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Blender
        run: cmake --build build --config Release --target blender

      - name: Package artifacts
        run: |
          mkdir package
          cp build/bin/Release/blender.exe package/
          cp "C:/Windows/System32/"{vcomp140.dll,msvcp140.dll,ucrtbase.dll} package/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: goo-engine-windows
          path: package/
